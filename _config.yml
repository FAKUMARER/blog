title: FAKUMARER 的博客
subtitle: ''
description: 'FAKUMARER 的个人博客，记录数论、算法竞赛与项目实践的学习笔记。'
keywords: 数论,整除分块,狄利克雷卷积,欧拉函数,离散对数,算法竞赛,OI,ICPC,学习笔记
author: FAKUMARER
language: zh-CN
timezone: 'Asia/Shanghai'

url: https://fakumarer.github.io
root: /blog/
permalink: :year/:month/:day/:title/

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false

# 定时发布依赖这一项：false 时日期在未来的文章不会被渲染
future: false

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 10
pagination_dir: page

theme: cnblog

markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - "@traptitech/markdown-it-katex"

# 文章加密（hexo-blog-encrypt）
encrypt:
  abstract: 这是一篇加密文章，请输入访问密码
  message: 请输入访问密码
  wrong_pass_message: 密码不正确，请重试
  theme: default
  # 记住密码：密钥存 localStorage，同一篇再访问不用重复输入
  autoSave: true
  # salt 跟 permalink 绑定；否则每次构建 salt 变化会让缓存全部失效
  stableSalt: true
  kdf:
    iterations: 600000
